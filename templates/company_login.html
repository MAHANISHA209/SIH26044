<!DOCTYPE html>
<html>

<head>

    <title>Company Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Company Login</h1>

    <form method="POST">

        <input type="email"
               name="email"
               placeholder="Enter company email"
               required>

        <input type="password"
               name="password"
               placeholder="Enter password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        New company?
        <a href="/company/register">
            Register here
        </a>
    </p>

</div>

</body>

</html>
