<!DOCTYPE html>
<html>

<head>

    <title>Company Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Company Registration</h1>

    <form method="POST">

        <input type="text"
               name="company_name"
               placeholder="Enter company name"
               required>

        <input type="email"
               name="email"
               placeholder="Enter company email"
               required>

        <input type="password"
               name="password"
               placeholder="Enter password"
               required>

        <input type="text"
               name="industry"
               placeholder="Enter industry"
               required>

        <textarea
            name="requirements"
            placeholder="Enter skills / requirements">
        </textarea>

        <button type="submit">
            Register Company
        </button>

    </form>

    <p>
        Already registered?
        <a href="/company/login">Company Login</a>
    </p>

</div>

</body>

</html>
