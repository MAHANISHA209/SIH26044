<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
     <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Student Login</h1>

    <form method="POST">

        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>

        <input type="password"
               name="password"
               placeholder="Enter your password"
               required>

        <button type="submit">Login</button>

    </form>

    <p>
        New student?
        <a href="/register">Register here</a>
    </p>

</div>

</body>
</html>
