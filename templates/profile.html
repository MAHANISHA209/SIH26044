<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>My Profile</h1>

    <form method="POST">

        <input type="text"
               name="skills"
               placeholder="Enter your skills"
               value="{{ student.skills or '' }}">

        <textarea
            name="projects"
            placeholder="Enter your projects">{{ student.projects or '' }}</textarea>

        <textarea
            name="certificates"
            placeholder="Enter your certificates">{{ student.certificates or '' }}</textarea>

        <button type="submit">
            Save Profile
        </button>

    </form>

    <br>

    <a href="/dashboard">
        <button>Back to Dashboard</button>
    </a>

</div>

</body>
</html>
